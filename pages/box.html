<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chiếc Hộp</title>

<link rel="stylesheet" href="../box.css">

</head>

<body>


<div class="container">

<div class="boxContainer">

<img
src="../assets/images/box.svg"
class="boxLogo"
id="magicBox"
alt="Chiếc Hộp Triết Lý">

<div id="lightEffect"></div>
    <div id="sparkles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    </div>
<div id="paper">
    <div class="paperCard">
        <div id="messageText">
✨ Đang chuẩn bị...
        </div>
    </div>
</div>


<h1>Chiếc Hộp Triết Lý</h1>

<p class="desc">

Nhấn nút bên dưới để mở chiếc hộp.

</p>

<button id="openBoxBtn">

Mở chiếc hộp

</button>

</div>

<script>

const box=document.getElementById("magicBox");
const light=document.getElementById("lightEffect");
const paper=document.getElementById("paper");  
const button=document.getElementById("openBoxBtn");

button.onclick = () => {

    button.disabled = true;
   box.classList.add("glow");
    button.innerText = "Đang mở...";

    light.classList.add("active");
     paper.classList.add("show");
    box.classList.add("shake");

    setTimeout(() => {

        box.classList.remove("shake");

    }, 500);
setTimeout(() => {

    window.location.href = "result.html";

}, 1800);
};
</script>



</body>

</html>
