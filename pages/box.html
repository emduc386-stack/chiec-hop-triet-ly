<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chiếc Hộp</title>

<link rel="stylesheet" href="../box.css">

</head>

<body>


<div class="container">

<div class="boxContainer">

<div id="magicBox" class="magicBox">

    <img
    src="../assets/images/box-lid.svg"
    id="boxLid"
    class="boxLid"
    alt="Nắp hộp">

    <img
    src="../assets/images/box-bottom.svg"
    class="boxBottom"
    alt="Thân hộp">

</div>

<div id="lightEffect"></div>
    <div id="magicLight"></div>
    <div id="sparkles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    </div>
<div id="paper">
    <div class="paperCard">
        <div id="messageText">
✨ Đang chuẩn bị...
        </div>
    </div>
</div>

<h1 id="boxTitle">📦 Chiếc Hộp</h1>


<p class="desc">

Nhấn nút bên dưới để mở chiếc hộp.

</p>

<button id="openBoxBtn">

Mở chiếc hộp

</button>

</div>

<script>

const box=document.getElementById("magicBox");
const boxLid = document.getElementById("boxLid");
 const boxType = localStorage.getItem("boxType");
   const buttonNames = {
    philosophy: "📘 Mở Hộp Triết Lý",
    love: "❤️ Mở Hộp Tình Yêu",
    motivation: "💪 Mở Hộp Động Lực",
    peace: "🌿 Mở Hộp Bình Yên"
}; 
const colors = {
    philosophy: "#4A90E2",
    love: "#FF5A8A",
    motivation: "#FF9800",
    peace: "#4CAF50"
};
const titles = {
    philosophy: "📘 Chiếc Hộp Triết Lý",
    love: "❤️ Chiếc Hộp Tình Yêu",
    motivation: "💪 Chiếc Hộp Động Lực",
    peace: "🌿 Chiếc Hộp Bình Yên"
};

document.getElementById("boxTitle").innerText =
titles[boxType];  
 document.getElementById("openBoxBtn").innerText =
buttonNames[boxType];   
   document.documentElement.style.setProperty(
    "--boxColor",
    colors[boxType]
); 
const light=document.getElementById("lightEffect");
const sparkles=document.getElementById("sparkles");
const paper=document.getElementById("paper");  
const button=document.getElementById("openBoxBtn");
const magicLight = document.getElementById("magicLight");
button.onclick = () => {

    button.disabled = true;
   box.classList.add("glow");
    sparkles.classList.add("sparkle");
    button.innerText = "✨ Đang mở...";
    button.style.opacity = "0.8";
button.style.transform = "scale(0.96)";
    light.classList.add("active");
     paper.classList.add("show");
    box.classList.add("shake");
    setTimeout(() => {

boxLid.classList.add("open");
magicLight.classList.add("show");
},500);


    setTimeout(() => {

        box.classList.remove("shake");

    }, 500);
setTimeout(() => {

    alert("Chuẩn bị sang result");
    window.location.href = "result.html";

}, 1800);
};
</script>

<script src="../js/navigation.js"></script>

</body>

</html>
