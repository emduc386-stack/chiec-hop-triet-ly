<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chiếc Hộp</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="container">
<div class="boxContainer">

    <img
        src="../assets/images/box.svg"
        class="boxLogo"
        id="magicBox"
        alt="Chiếc Hộp Triết Lý">

</div>

<h2>Chiếc Hộp Triết Lý</h2>

<p class="desc">
Nhấn nút bên dưới để mở chiếc hộp.
</p>

<button id="openBoxBtn">
Mở chiếc hộp
</button>


</div>
<script>

const box = document.getElementById("magicBox");
const button = document.getElementById("openBoxBtn");

button.onclick = () => {

    box.style.transform = "scale(1.15)";

    setTimeout(() => {
        box.style.transform = "scale(1)";
    }, 300);

};

</script>
</body>

</html>
