<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thông điệp hôm nay</title>

<link rel="stylesheet" href="../box.css">

<script src="../data/messages.js"></script>

</head>

<body>

<div class="container">

<div class="paperCard">

<h2 class="paperTitle">
✨<br>
Thông điệp<br>
dành cho bạn
</h2>

<p id="messageText" class="messageText"></p>
<button onclick="location.href='box.html'">
Mở hộp khác
</button>

</div>

</div>

<script>
  const boxType = localStorage.getItem("boxType");
const currentMessages = messages[boxType];  
const today = new Date().toDateString();

let savedDate = localStorage.getItem("messageDate");
let savedIndex = localStorage.getItem("messageIndex");

let randomIndex;
if(savedIndex !== null &&
   Number(savedIndex) >= currentMessages.length){

    savedIndex = null;

}
if(savedDate === today && savedIndex !== null){

    randomIndex = Number(savedIndex);

}else{

    randomIndex = Math.floor(
    Math.random() * currentMessages.length
);

    localStorage.setItem("messageDate", today);

    localStorage.setItem("messageIndex", randomIndex);

}


const randomMessage = currentMessages[randomIndex];
const history =
JSON.parse(localStorage.getItem("messageHistory")) || [];
 history.unshift({

    date: today,

    type: localStorage.getItem("boxType"),

    message: randomMessage

});
    if(history.length > 50){

    history.length = 50;

    }
    localStorage.setItem(

    "messageHistory",

    JSON.stringify(history)

);
const messageElement =
document.getElementById("messageText");

let index = 0;
let text = "";

function typeWriter() {
    if (index < randomMessage.length) {
        text += randomMessage[index];
        messageElement.textContent = text;
        index++;
        setTimeout(typeWriter, 35);
    }
}

typeWriter();

</script>

</body>

</html>
