<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thông điệp hôm nay</title>

<link rel="stylesheet" href="../box.css">

<script src="../data/messages.js"></script>

</head>

<body>

<div class="container">

<div class="paperCard">

<h2 class="paperTitle">
✨<br>
Thông điệp<br>
dành cho bạn
</h2>

<p id="messageText" class="messageText"></p>
<button onclick="location.href='box.html'">
Mở hộp khác
</button>

</div>

</div>

<script>
const randomMessage =
messages[Math.floor(Math.random() * messages.length)];

const messageElement =
document.getElementById("messageText");

let index = 0;
let text = "";

function typeWriter() {
    if (index < randomMessage.length) {
        text += randomMessage[index];
        messageElement.textContent = text;
        index++;
        setTimeout(typeWriter, 35);
    }
}

typeWriter();

</script>

</body>

</html>
