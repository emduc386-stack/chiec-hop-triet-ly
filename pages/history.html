</head>

<body>





<div class="bottomNav">

<a href="choose-box.html" class="navItem">

<div class="container">

<h1>📖 Lịch sử thông điệp</h1>


<button onclick="clearHistory()" class="deleteBtn">
🗑 Xóa lịch sử
</button>

<br><br>
<div id="historyList">

Đang tải...

</div>

<br>

<button onclick="location.href='box.html'">

📦 Mở hộp

</button>



<button onclick="clearHistory()" class="deleteBtn">
🗑 Xóa lịch sử
</button>

<br><br>

</div>

<script>

const history =
JSON.parse(localStorage.getItem("messageHistory")) || [];

const list =
document.getElementById("historyList");

if(history.length===0){

    list.innerHTML="<p>Chưa có thông điệp nào.</p>";

}else{

    list.innerHTML="";

    history.forEach((item,index)=>{

    const icons = {
        philosophy:"📘",
        love:"❤️",
        motivation:"💪",
        peace:"🌿"
    };

    const names = {
        philosophy:"Triết Lý",
        love:"Tình Yêu",
        motivation:"Động Lực",
        peace:"Bình Yên"
    };

    list.innerHTML += `

<div class="historyCard"
onclick="openHistory(${index})">



        <div class="historyDate">
            ${item.date}
        </div>

        <div class="historyType">
            ${icons[item.type]}<br>
            ${names[item.type]}
        </div>

        <div class="historyMessage">
            ${item.message}
        </div>

    </div>

    `;

});
    const cards = document.querySelectorAll(".historyCard");

cards.forEach((card,index)=>{
    setTimeout(()=>{
        card.classList.add("show");
    }, index * 120);
});
}
function openHistory(index){

    localStorage.setItem(
        "historyIndex",
        index
    );

    location.href =
    "history-detail.html";

}
    function clearHistory(){

    if(confirm("Bạn có chắc muốn xóa toàn bộ lịch sử?")){

        localStorage.removeItem("messageHistory");

        location.reload();

    }

    }
    window.openHistory = openHistory;
</script>

</body>

</html>
