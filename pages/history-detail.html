<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Chi tiết thông điệp</title>

<link rel="stylesheet"
href="../style.css">

</head>

<body>

<div class="container">

<div class="paperCard">

<h2 id="detailTitle">
📖 Thông điệp
</h2>

<p id="detailDate"></p>

<p id="detailType"></p>

<p id="detailMessage"
class="messageText">
</p>
<br>

<button id="favoriteBtn"
onclick="toggleFavorite()">

🤍 Thêm vào yêu thích

</button>
<br>

<button
onclick="location.href='history.html'">

⬅ Quay lại

</button>

</div>

</div>

<script>

const history =
JSON.parse(localStorage.getItem("messageHistory")) || [];

const index =
Number(localStorage.getItem("historyIndex"));

if (
    isNaN(index) ||
    index < 0 ||
    index >= history.length
){
    location.href = "history.html";
}

const item = history[index];

const names = {
    philosophy:"📘 Hộp Triết Lý",
    love:"❤️ Hộp Tình Yêu",
    motivation:"💪 Hộp Động Lực",
    peace:"🌿 Hộp Bình Yên"
};

document.getElementById("detailDate").innerText = item.date;
document.getElementById("detailType").innerText = names[item.type];
document.getElementById("detailMessage").innerText = item.message;

</script>
<script src="../js/navigation.js"></script>
</body>

</html>
<script src="../js/navigation.js"></script>
