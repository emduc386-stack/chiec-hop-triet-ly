<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bạn đã sẵn sàng?</title>

<link rel="stylesheet" href="../style.css">

</head>

<body>

<div class="container">

<img
src="../assets/images/box.svg"
class="boxLogo"
alt="Chiếc Hộp Triết Lý">

<h2 id="readyTitle">
Đang chuẩn bị...
</h2>

<p class="desc">

Một thông điệp dành riêng cho bạn
đã sẵn sàng.

<br><br>

Bạn đã sẵn sàng mở chiếc hộp chưa?

</p>

<button onclick="alert('Đã bấm Mở ngay'); location.href='box.html';">
💙 Mở ngay
</button>

<br><br>

<button
class="secondaryBtn"
onclick="location.href='../index.html'">

🤍 Chưa

</button>

</div>
<script>

const type = localStorage.getItem("boxType");

const names = {
    philosophy:"📘 Hộp Triết Lý",
    love:"❤️ Hộp Tình Yêu",
    motivation:"💪 Hộp Động Lực",
    peace:"🌿 Hộp Bình Yên"
};

document.getElementById("readyTitle").innerText =
names[type] || "📦 Chiếc Hộp";

</script>
</body>

</html>
