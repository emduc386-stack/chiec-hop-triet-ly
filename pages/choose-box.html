<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chọn hộp</title>

<link rel="stylesheet" href="../style.css">
  <script src="../data/boxSuggest.js"></script>
</head>

<body>

<div class="container">

<h1>📦 Chọn chiếc hộp hôm nay</h1>
<p id="suggestText"></p>
  <div id="scoreBoard">

    <div class="scoreItem">
        <span>📘 Triết Lý</span>
        <span id="philosophyScore">0%</span>
    </div>

    <div class="scoreItem">
        <span>❤️ Tình Yêu</span>
        <span id="loveScore">0%</span>
    </div>

    <div class="scoreItem">
        <span>💪 Động Lực</span>
        <span id="motivationScore">0%</span>
    </div>

    <div class="scoreItem">
        <span>🌿 Bình Yên</span>
        <span id="peaceScore">0%</span>
    </div>

  </div>
<p class="desc">
Hãy chọn chiếc hộp bạn muốn mở.
</p>

<button id="philosophyBtn"
onclick="chooseBox('philosophy')">
📘 Hộp Triết Lý
</button>

<br><br>
<button id="loveBtn"
onclick="chooseBox('love')">
❤️ Hộp Tình Yêu
</button>


<br><br>

<button id="motivationBtn"
onclick="chooseBox('motivation')">
💪 Hộp Động Lực
</button>

<br><br>
<button id="peaceBtn"
onclick="chooseBox('peace')">
🌿 Hộp Bình Yên
</button>


</div>

<script>
  const answers = JSON.parse(
    localStorage.getItem("surveyAnswers")
) || [];

const suggestion = suggestBox(answers);
  const scores = calculateScores(answers);
function chooseBox(type){

localStorage.setItem("boxType", type);

location.href = "ready.html";

}
  window.onload = function(){

    const names = {
        philosophy:"📘 Hộp Triết Lý",
        love:"❤️ Hộp Tình Yêu",
        motivation:"💪 Hộp Động Lực",
        peace:"🌿 Hộp Bình Yên"
    };

    document.getElementById("suggestText").innerText =
    "✨ Chúng tôi gợi ý: " + names[suggestion];

    document
        .getElementById(suggestion + "Btn")
        .classList.add("recommend");

};
  const total =
scores.philosophy +
scores.love +
scores.motivation +
scores.peace;

function percent(value){

    if(total===0) return 0;

    return Math.round(value/total*100);

}

document.getElementById("philosophyScore").innerText =
percent(scores.philosophy)+"%";

document.getElementById("loveScore").innerText =
percent(scores.love)+"%";

document.getElementById("motivationScore").innerText =
percent(scores.motivation)+"%";

document.getElementById("peaceScore").innerText =
percent(scores.peace)+"%";
</script>

</body>

</html>
