<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chọn hộp</title>

<link rel="stylesheet" href="../style.css">
  <script src="../data/boxSuggest.js"></script>
</head>

<body>

<div class="container">

<h1>📦 Chọn chiếc hộp hôm nay</h1>
<p id="suggestText"></p>
  <div id="scoreBoard">

  

    <div class="scoreItem" id="philosophyCard">

        <div class="scoreTitle">

            <span>📘 Triết Lý</span>

            <span id="philosophyScore">0%</span>

        </div>

        <div class="progress">

            <div id="philosophyBar"
                 class="progressFill"></div>

        </div>

    </div>


    <div class="scoreItem" id="loveCard">

        <div class="scoreTitle">

            <span>❤️ Tình Yêu</span>

            <span id="loveScore">0%</span>

        </div>

        <div class="progress">

            <div id="loveBar"
                 class="progressFill"></div>

        </div>

    </div>


   <div class="scoreItem" id="motivationCard">

        <div class="scoreTitle">

            <span>💪 Động Lực</span>

            <span id="motivationScore">0%</span>

        </div>

        <div class="progress">

            <div id="motivationBar"
                 class="progressFill"></div>

        </div>

    </div>


    <div class="scoreItem" id="peaceCard">

        <div class="scoreTitle">

            <span>🌿 Bình Yên</span>

            <span id="peaceScore">0%</span>

        </div>

        <div class="progress">

            <div id="peaceBar"
                 class="progressFill"></div>

        </div>

    </div>

    
<script>
  const answers = JSON.parse(
    localStorage.getItem("surveyAnswers")
) || [];

const suggestion = suggestBox(answers);
  const scores = calculateScores(answers);
function chooseBox(type){

localStorage.setItem("boxType", type);

location.href = "ready.html";

}
  window.onload = function(){

    const names = {
        philosophy:"📘 Hộp Triết Lý",
        love:"❤️ Hộp Tình Yêu",
        motivation:"💪 Hộp Động Lực",
        peace:"🌿 Hộp Bình Yên"
    };

    document.getElementById("suggestText").innerText =
    "✨ Chúng tôi gợi ý: " + names[suggestion];

    document
        .getElementById(suggestion + "Btn")
        .classList.add("recommend");
document
.getElementById(suggestion + "Bar")
.classList.add("recommendBar");
};document
.getElementById(suggestion + "Card")
.classList.add("recommendCard");
  const total =
scores.philosophy +
scores.love +
scores.motivation +
scores.peace;

function percent(value){

    if(total===0) return 0;

    return Math.round(value/total*100);

}

const result = {

    philosophy: percent(scores.philosophy),

    love: percent(scores.love),

    motivation: percent(scores.motivation),

    peace: percent(scores.peace)

};

animateScore("philosophy", result.philosophy);

animateScore("love", result.love);

animateScore("motivation", result.motivation);

animateScore("peace", result.peace);
  function animateScore(name,target){

    let value = 0;

    const score =
    document.getElementById(name+"Score");

    const bar =
    document.getElementById(name+"Bar");

    const timer = setInterval(function(){

        value++;

        score.innerText = value + "%";

        bar.style.width = value + "%";

        if(value>=target){

            clearInterval(timer);

        }

    },15);

  }
</script>

</body>

</html>
